name: Validate and deploy web
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_PUBLIC_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: out/
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    environment: production
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_API_URL: ${{ vars.API_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node -e "if(process.env.GITHUB_REF_NAME!=='v'+require('./package.json').version)throw Error('Tag must match package version');if(!process.env.NEXT_PUBLIC_API_URL?.startsWith('https://'))throw Error('Set HTTPS API_PUBLIC_URL')"
      - run: npm ci
      - run: npx vercel@65.14.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
      - run: npx vercel@65.14.0 build --prod --token "$VERCEL_TOKEN"
      - run: npx vercel@65.14.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
